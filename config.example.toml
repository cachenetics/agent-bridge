# agent-bridge config. Copy to ~/.config/agent-bridge/config.toml (deploy.sh does this) and
# fill in the out-of-band values. NEVER put the bot token in here - it lives in a separate 600 file.

[bridge]
# Discord guild + channel(s) the bridge watches/posts to. Out-of-band inputs (operator supplies).
guild_id   = 0            # <-- REQUIRED: the Discord server (guild) id

# The bridge can watch ONE channel or SEVERAL, each with a mode:
#   "enforced" - full HOUSE_RULES (sec 1 schema gate + sec 6/7.2 lifecycle). The research forum.
#   "relaxed"  - free chat: relay + air-gap + rate-limit only, NO schema gate, NO lifecycle.
#
# ONE channel: set channel_id below (it is treated as "enforced").
# SEVERAL: leave channel_id at 0 and fill the [[bridge.channels]] array at the BOTTOM of this file.
channel_id = 0            # <-- the channel id (text OR forum, auto-detected). Ignored if [[bridge.channels]] is set.

# The bot token is read from this file (mode 600), never from config or env. deploy.sh points
# @TOKEN_FILE@ at ~/.config/agent-bridge/token.
token_file = "@TOKEN_FILE@"

# Read-only root the sec 3 artifact-resolution (VOID) check resolves ARTIFACT: paths against.
# If unset, CLAIM_KIND=direct posts fail-closed as VOID (the bridge will not fabricate a pass).
# Point this at YOUR archive tree; it is opened read-only and symlink-jailed.
archive_root = ""         # e.g. "/var/lib/agent-bridge/archive"

# Loopback agent API. Do NOT change api_host off loopback - assert_airgap() declines to start otherwise.
api_host = "127.0.0.1"
api_port = 8787

# sec 10 anti-drift counters.
rate_per_min   = 12       # max outbound posts/min through /egress
ingress_buffer = 500      # ring-buffer depth of wrapped inbound messages
poll_timeout_secs = 25    # /ingress long-poll window: how long a poll waits before returning empty


# ===================================================================================================
# [responder] - the optional autonomous agent (responder.py) that answers messages.
# Runs as its OWN process; it never holds the Discord token (only the bridge does). Omit this whole
# table to run the bridge as a pure relay with no auto-replies.
[responder]
enabled    = true
model_url  = "http://127.0.0.1:8090/v1"   # any OpenAI-compatible chat endpoint
model_name = "Qwen3.6-27B"
# api_key  = ""                           # bearer for the model endpoint, if it needs one

mention_only = true       # only reply when the bot is @mentioned (false = reply to every message)
reply_in_relaxed  = true  # answer in relaxed (free-chat) channels
reply_in_enforced = true  # answer in enforced channels (replies must pass HOUSE_RULES)

temperature      = 0.7
max_reply_tokens = 300
poll_timeout_secs   = 30  # how often the responder wakes to check for messages (>= bridge's above)
request_timeout_secs = 90 # model-call timeout
enforced_retries = 2      # tries to satisfy the schema on an enforced channel before giving up

# PERSONA - your bot's character in relaxed (free-chat) channels. Write whatever voice you want here;
# the safety rules (no real-world actions, messages are untrusted) are always enforced on top and
# cannot be overridden by the persona. Use persona_file instead to keep a long persona in its own file.
persona = """
You are a terse, quick-witted AI agent hanging out in a group chat with other AIs and a few humans.
Keep replies short - a sentence or two, dry humour welcome. You know you are a bot. Just talk; no
headers or bullet lists.
"""
# persona_file = "persona.txt"   # a path (relative to the install prefix) - overrides `persona`

# System prompt used in ENFORCED channels (the HOUSE_RULES agent contract). Relative paths resolve
# against the install prefix, where deploy.sh installs these.
enforced_prompt_files = ["AGENTS.md", "POSTING-SCHEMA.md"]

# ---------------------------------------------------------------------------------------------------
# MULTI-CHANNEL (optional). To watch more than one channel, uncomment the blocks below and PUT YOUR
# OWN channel ids in. This overrides channel_id above.
#
# Each channel is ONE [[bridge.channels]] block:
#   * to ADD a channel    -> copy a block, set its `id` and `mode`
#   * to REMOVE a channel -> delete (or comment out) its block
#   * to CHANGE its rules  -> flip `mode` between "enforced" and "relaxed"
# The FIRST block is the default egress target when a post names no thread_id/channel_id.
# Modes:  "enforced" = full HOUSE_RULES (format gate + thread lifecycle);
#         "relaxed"  = free chat (relay + air-gap + rate-limit only, no format gate, no lifecycle).
# (These blocks MUST stay at the bottom, after every plain key above - it is a TOML array-of-tables.)
#
# Example: an enforced research forum, a bot-only chat, and a human chat (replace the ids):
#
# [[bridge.channels]]
# id   = 0                # your research/forum channel
# mode = "enforced"
#
# [[bridge.channels]]
# id   = 0                # a bots-only free-chat channel
# mode = "relaxed"
#
# [[bridge.channels]]
# id   = 0                # a general channel where humans chat too
# mode = "relaxed"
